openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: صرح - Career Development Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: profile
    description: User profile operations
  - name: skills
    description: Skills management
  - name: courses
    description: Course recommendations
  - name: jobs
    description: Job recommendations
  - name: badges
    description: Digital badges
  - name: career
    description: Career path and analytics
  - name: chat
    description: AI Chatbot
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with national ID and Nafath
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Unauthorized

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout user
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user session
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSession"
        "401":
          description: Not authenticated

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    put:
      operationId: updateProfile
      tags: [profile]
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"

  /profile/cv/analyze:
    post:
      operationId: analyzeCv
      tags: [profile]
      summary: Trigger CV analysis after upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CvAnalyzeInput"
      responses:
        "200":
          description: CV analyzed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CvAnalysis"

  /profile/completion:
    get:
      operationId: getProfileCompletion
      tags: [profile]
      summary: Get profile completion percentage and missing items
      responses:
        "200":
          description: Profile completion status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileCompletion"

  /skills:
    get:
      operationId: getSkills
      tags: [skills]
      summary: Get user skills
      responses:
        "200":
          description: User skills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Skill"
    post:
      operationId: addSkill
      tags: [skills]
      summary: Add a skill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillInput"
      responses:
        "201":
          description: Skill added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"

  /skills/{id}:
    delete:
      operationId: deleteSkill
      tags: [skills]
      summary: Remove a skill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Skill removed

  /skills/gaps:
    get:
      operationId: getSkillGaps
      tags: [skills]
      summary: AI-powered skill gap analysis
      responses:
        "200":
          description: Skill gap analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillGapAnalysis"

  /courses:
    get:
      operationId: getCourses
      tags: [courses]
      summary: Get recommended courses based on skill gaps
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Recommended courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"

  /jobs:
    get:
      operationId: getJobs
      tags: [jobs]
      summary: Get recommended jobs based on skills and career goal
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: readyOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Recommended jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"

  /badges:
    get:
      operationId: getBadges
      tags: [badges]
      summary: Get user's earned digital badges
      responses:
        "200":
          description: Digital badges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Badge"

  /career/path:
    get:
      operationId: getCareerPath
      tags: [career]
      summary: Get personalized career roadmap
      responses:
        "200":
          description: Career path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerPath"

  /career/dashboard:
    get:
      operationId: getCareerDashboard
      tags: [career]
      summary: Get career dashboard summary
      responses:
        "200":
          description: Career dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerDashboard"

  /career/certifications:
    get:
      operationId: getCertifications
      tags: [career]
      summary: Get linked academic and professional certifications
      responses:
        "200":
          description: Certifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Certification"
    post:
      operationId: addCertification
      tags: [career]
      summary: Add a certification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificationInput"
      responses:
        "201":
          description: Certification added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certification"

  /career/activities:
    get:
      operationId: getActivities
      tags: [career]
      summary: Get extracurricular activities (clubs, external centers)
      responses:
        "200":
          description: Activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
    post:
      operationId: addActivity
      tags: [career]
      summary: Add an activity with proof
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityInput"
      responses:
        "201":
          description: Activity added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"

  /chat/message:
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send message to AI career advisor chatbot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"

  /chat/history:
    get:
      operationId: getChatHistory
      tags: [chat]
      summary: Get chat history
      responses:
        "200":
          description: Chat history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    LoginInput:
      type: object
      required: [nationalId, fullName]
      properties:
        nationalId:
          type: string
          description: Saudi national ID (السجل المدني)
        fullName:
          type: string
          description: Full name in Arabic
        nafathVerified:
          type: boolean
          description: Whether Nafath verification was completed
          default: false

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/UserSession"
        token:
          type: string
        isNewUser:
          type: boolean

    UserSession:
      type: object
      required: [id, nationalId, fullName]
      properties:
        id:
          type: integer
        nationalId:
          type: string
        fullName:
          type: string
        profileComplete:
          type: boolean
        avatarInitials:
          type: string

    Profile:
      type: object
      required: [id, nationalId, fullName]
      properties:
        id:
          type: integer
        nationalId:
          type: string
        fullName:
          type: string
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        careerGoal:
          type: ["string", "null"]
        currentRole:
          type: ["string", "null"]
        educationLevel:
          type: ["string", "null"]
        university:
          type: ["string", "null"]
        major:
          type: ["string", "null"]
        gpa:
          type: ["number", "null"]
        interests:
          type: array
          items:
            type: string
        hobbies:
          type: array
          items:
            type: string
        languages:
          type: array
          items:
            $ref: "#/components/schemas/Language"
        cvFileName:
          type: ["string", "null"]
        cvAnalyzed:
          type: boolean
        desiredSkills:
          type: array
          items:
            type: string
        profileCompleteness:
          type: integer
        createdAt:
          type: string

    ProfileInput:
      type: object
      properties:
        email:
          type: string
        phone:
          type: string
        careerGoal:
          type: string
        currentRole:
          type: string
        educationLevel:
          type: string
        university:
          type: string
        major:
          type: string
        gpa:
          type: number
        interests:
          type: array
          items:
            type: string
        hobbies:
          type: array
          items:
            type: string
        languages:
          type: array
          items:
            $ref: "#/components/schemas/Language"
        desiredSkills:
          type: array
          items:
            type: string

    Language:
      type: object
      required: [name, level]
      properties:
        name:
          type: string
        level:
          type: string
          enum: [beginner, intermediate, advanced, native]

    CvAnalyzeInput:
      type: object
      required: [fileName]
      properties:
        fileName:
          type: string
        fileContent:
          type: string
          description: Base64-encoded file content

    CvAnalysis:
      type: object
      required: [fileName, extractedSkills, summary]
      properties:
        fileName:
          type: string
        extractedSkills:
          type: array
          items:
            type: string
        summary:
          type: string
        experienceYears:
          type: ["number", "null"]
        educationFound:
          type: ["string", "null"]

    ProfileCompletion:
      type: object
      required: [percentage, completedItems, missingItems]
      properties:
        percentage:
          type: integer
        completedItems:
          type: array
          items:
            type: string
        missingItems:
          type: array
          items:
            type: string

    Skill:
      type: object
      required: [id, name, category, type]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        type:
          type: string
          enum: [current, desired]
        proficiencyLevel:
          type: ["string", "null"]
          enum: [beginner, intermediate, advanced, expert, null]
        verified:
          type: boolean

    SkillInput:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        category:
          type: string
        type:
          type: string
          enum: [current, desired]
        proficiencyLevel:
          type: string

    SkillGapAnalysis:
      type: object
      required: [careerGoal, missingSkills, strengthSkills, overallReadiness]
      properties:
        careerGoal:
          type: string
        missingSkills:
          type: array
          items:
            $ref: "#/components/schemas/GapSkill"
        strengthSkills:
          type: array
          items:
            type: string
        overallReadiness:
          type: integer
        recommendations:
          type: array
          items:
            type: string

    GapSkill:
      type: object
      required: [name, priority, reason]
      properties:
        name:
          type: string
        priority:
          type: string
          enum: [high, medium, low]
        reason:
          type: string

    Course:
      type: object
      required: [id, title, provider, url, skills]
      properties:
        id:
          type: integer
        title:
          type: string
        titleAr:
          type: string
        provider:
          type: string
        url:
          type: string
        skills:
          type: array
          items:
            type: string
        duration:
          type: ["string", "null"]
        level:
          type: ["string", "null"]
        isFree:
          type: boolean
        relevanceScore:
          type: integer
        category:
          type: string

    Job:
      type: object
      required: [id, title, organization, platform, applyUrl]
      properties:
        id:
          type: integer
        title:
          type: string
        titleAr:
          type: string
        organization:
          type: string
        salaryMin:
          type: ["integer", "null"]
        salaryMax:
          type: ["integer", "null"]
        platform:
          type: string
        applyUrl:
          type: string
        requiredSkills:
          type: array
          items:
            type: string
        matchedSkills:
          type: array
          items:
            type: string
        missingSkills:
          type: array
          items:
            type: string
        matchPercentage:
          type: integer
        canApply:
          type: boolean
        location:
          type: ["string", "null"]
        jobType:
          type: ["string", "null"]

    Badge:
      type: object
      required: [id, title, description, earnedAt, category]
      properties:
        id:
          type: integer
        title:
          type: string
        titleAr:
          type: string
        description:
          type: string
        earnedAt:
          type: string
        category:
          type: string
        icon:
          type: string
        color:
          type: string
        verificationUrl:
          type: ["string", "null"]
        issuer:
          type: string

    CareerPath:
      type: object
      required: [goal, stages, estimatedMonths]
      properties:
        goal:
          type: string
        stages:
          type: array
          items:
            $ref: "#/components/schemas/CareerStage"
        estimatedMonths:
          type: integer
        currentStage:
          type: integer
        overallProgress:
          type: integer

    CareerStage:
      type: object
      required: [stage, title, description, skills, status]
      properties:
        stage:
          type: integer
        title:
          type: string
        description:
          type: string
        skills:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [completed, in_progress, upcoming]
        durationMonths:
          type: integer

    CareerDashboard:
      type: object
      required: [profileScore, skillsCount, badgesCount, coursesCount, jobMatchCount]
      properties:
        profileScore:
          type: integer
        skillsCount:
          type: integer
        badgesCount:
          type: integer
        coursesCount:
          type: integer
        jobMatchCount:
          type: integer
        careerReadiness:
          type: integer
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
        topSkillGaps:
          type: array
          items:
            type: string

    ActivityItem:
      type: object
      required: [type, title, date]
      properties:
        type:
          type: string
        title:
          type: string
        date:
          type: string

    Certification:
      type: object
      required: [id, title, issuer, type]
      properties:
        id:
          type: integer
        title:
          type: string
        issuer:
          type: string
        type:
          type: string
          enum: [academic, professional, language, government]
        score:
          type: ["string", "null"]
        dateEarned:
          type: ["string", "null"]
        expiryDate:
          type: ["string", "null"]
        verificationProof:
          type: ["string", "null"]
        verified:
          type: boolean
        platform:
          type: ["string", "null"]

    CertificationInput:
      type: object
      required: [title, issuer, type]
      properties:
        title:
          type: string
        issuer:
          type: string
        type:
          type: string
          enum: [academic, professional, language, government]
        score:
          type: string
        dateEarned:
          type: string
        expiryDate:
          type: string
        verificationProof:
          type: string
        platform:
          type: string

    Activity:
      type: object
      required: [id, title, organization, type]
      properties:
        id:
          type: integer
        title:
          type: string
        organization:
          type: string
        type:
          type: string
          enum: [university_club, external_center, volunteer, competition, internship]
        role:
          type: ["string", "null"]
        startDate:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        proofFile:
          type: ["string", "null"]
        verified:
          type: boolean

    ActivityInput:
      type: object
      required: [title, organization, type]
      properties:
        title:
          type: string
        organization:
          type: string
        type:
          type: string
          enum: [university_club, external_center, volunteer, competition, internship]
        role:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        description:
          type: string
        proofFile:
          type: string

    ChatMessageInput:
      type: object
      required: [message]
      properties:
        message:
          type: string
        context:
          type: string

    ChatResponse:
      type: object
      required: [id, reply, timestamp]
      properties:
        id:
          type: integer
        reply:
          type: string
        timestamp:
          type: string
        suggestions:
          type: array
          items:
            type: string

    ChatMessage:
      type: object
      required: [id, role, content, timestamp]
      properties:
        id:
          type: integer
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        timestamp:
          type: string
